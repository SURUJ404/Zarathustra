<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Astra Playground</title>
<script src="https://cdn.jsdelivr.net/npm/monaco-editor@0.45.0/min/vs/loader.js"></script>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; height: 100vh; overflow: hidden; background: #1e1e1e; color: #ccc; }
.app { display: flex; flex-direction: column; height: 100vh; }
.toolbar { display: flex; align-items: center; gap: 8px; padding: 8px 16px; background: #252526; border-bottom: 1px solid #333; }
.toolbar h1 { font-size: 14px; font-weight: 600; margin-right: 16px; color: #e0e0e0; }
.toolbar h1 span { color: #d4a84b; }
.btn { padding: 6px 14px; border: none; border-radius: 4px; font-size: 12px; font-weight: 500; cursor: pointer; transition: all 0.15s; }
.btn-primary { background: #0e639c; color: #fff; }
.btn-primary:hover { background: #1177bb; }
.btn-success { background: #1b6d3e; color: #fff; }
.btn-success:hover { background: #228b4f; }
.btn-danger { background: #6b3030; color: #fff; }
.btn-danger:hover { background: #853a3a; }
.btn-outline { background: transparent; color: #ccc; border: 1px solid #555; }
.btn-outline:hover { background: #333; }
.badge { font-size: 11px; padding: 2px 8px; border-radius: 10px; background: #333; margin-left: auto; }
.badge-ok { background: #1b6d3e; }
.badge-error { background: #6b3030; }
.main { display: flex; flex: 1; overflow: hidden; }
.editor-pane { flex: 1; display: flex; flex-direction: column; border-right: 1px solid #333; }
.editor-header { padding: 6px 12px; background: #2d2d2d; font-size: 11px; text-transform: uppercase; letter-spacing: 0.5px; border-bottom: 1px solid #333; }
#editor { flex: 1; }
.output-pane { width: 420px; min-width: 300px; display: flex; flex-direction: column; background: #1e1e1e; }
.output-tabs { display: flex; background: #2d2d2d; border-bottom: 1px solid #333; }
.output-tab { padding: 6px 14px; font-size: 11px; cursor: pointer; border-bottom: 2px solid transparent; text-transform: uppercase; letter-spacing: 0.5px; }
.output-tab.active { border-bottom-color: #0e639c; color: #fff; }
.output-tab:hover { background: #333; }
.output-content { flex: 1; overflow: auto; padding: 12px; font-family: 'Cascadia Code', 'Fira Code', 'JetBrains Mono', monospace; font-size: 13px; line-height: 1.5; white-space: pre-wrap; }
.input-row { padding: 8px 12px; border-top: 1px solid #333; background: #252526; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.input-row input { background: #1e1e1e; border: 1px solid #555; color: #ccc; padding: 6px 10px; border-radius: 4px; font-family: monospace; font-size: 12px; width: 120px; }
.input-row input:focus { outline: none; border-color: #0e639c; }
.input-row label { font-size: 11px; color: #888; }
.hidden { display: none; }
</style>
</head>
<body>
<div class="app">
  <div class="toolbar">
    <h1>✦ <span>Astra</span> Playground</h1>
    <button class="btn btn-primary" onclick="compile()">▶ Compile</button>
    <button class="btn btn-success" onclick="prove()">📜 Prove</button>
    <button class="btn btn-danger" onclick="verify()">✅ Verify</button>
    <button class="btn btn-outline" onclick="reset()">↺ Reset</button>
    <button class="btn btn-outline" onclick="downloadReport()" id="btnReport" disabled>📊 Report</button>
    <a href="index.html" class="btn btn-outline" style="text-decoration:none;margin-left:auto;">ℹ About</a>
    <span style="font-size:11px;color:#888;margin-left:8px" id="apiIndicator"></span>
    <span class="badge" id="statusBadge">Ready</span>
  </div>

  <div class="main">
    <div class="editor-pane">
      <div class="editor-header">program.zara</div>
      <div id="editor"></div>
    </div>

    <div class="output-pane">
      <div class="output-tabs">
        <div class="output-tab active" onclick="switchTab('console')">Console</div>
        <div class="output-tab" onclick="switchTab('proof')">Proof</div>
      </div>
      <div class="output-content" id="outputConsole">// Ready. Write code and click Compile, Prove, or Verify.</div>
      <div class="output-content hidden" id="outputProof"></div>

      <div class="input-row">
        <label for="privInput">Private input:</label>
        <input id="privInput" type="text" value="12" placeholder="e.g. 12">
        <label for="pubInput" style="margin-left:12px;">Public input:</label>
        <input id="pubInput" type="text" placeholder="e.g. 144">
        <span style="font-size:11px;color:#666;">(comma-separated)</span>
      </div>
    </div>
  </div>
</div>

<script>
let API_BASE = window.location.origin;
const urlParams = new URLSearchParams(window.location.search);
if (urlParams.get('api')) API_BASE = urlParams.get('api');

async function apiPost(path, body) {
    const res = await fetch(API_BASE + path, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(body),
    });
    const text = await res.text();
    try { return JSON.parse(text); }
    catch { throw new Error('Server error: ' + text.slice(0, 200)); }
}

let editor;
let reportLog = [];

function addReport(action, code, privateInputs, publicInputs, ok, result) {
    reportLog.push({
        timestamp: new Date().toISOString(),
        action,
        code: code.slice(0, 200),
        private: privateInputs,
        public: publicInputs,
        status: ok ? 'PASS' : 'FAIL',
        result: (result || '').slice(0, 300),
    });
    document.getElementById('btnReport').disabled = false;
}

(async function() {
    const el = document.getElementById('apiIndicator');
    try {
        const res = await fetch(API_BASE + '/api/health');
        const data = await res.json();
        el.textContent = data.astra ? '🟢 Backend OK' : '🔴 No binary';
    } catch {
        el.textContent = '🔴 Backend unreachable';
    }
})();

require.config({ paths: { vs: 'https://cdn.jsdelivr.net/npm/monaco-editor@0.45.0/min/vs' } });
require(['vs/editor/editor.main'], function () {
    editor = monaco.editor.create(document.getElementById('editor'), {
        value: DEFAULT_CODE,
        language: 'plaintext',
        theme: 'vs-dark',
        fontSize: 14,
        fontFamily: "'Cascadia Code', 'Fira Code', monospace",
        minimap: { enabled: false },
        automaticLayout: true,
        padding: { top: 12 },
        scrollBeyondLastLine: false,
    });
});

const DEFAULT_CODE = `// Astra - Zero Knowledge DSL
// Prove you know x, y such that x + y == sum

def main(field public sum, field private x, field private y) -> field {
    assert(x + y == sum);
    return 1;
}
`;

function setStatus(msg, ok) {
    const badge = document.getElementById('statusBadge');
    badge.textContent = msg;
    badge.className = 'badge' + (ok === true ? ' badge-ok' : ok === false ? ' badge-error' : '');
}

function getPrivate() {
    const raw = document.getElementById('privInput').value.trim();
    return raw ? raw.split(',').map(s => s.trim()).filter(Boolean) : [];
}
function getPublic() {
    const raw = document.getElementById('pubInput').value.trim();
    return raw ? raw.split(',').map(s => s.trim()).filter(Boolean) : [];
}

function switchTab(tab) {
    document.querySelectorAll('.output-tab').forEach(t => t.classList.remove('active'));
    document.querySelectorAll('.output-content').forEach(t => t.classList.add('hidden'));
    event.target.classList.add('active');
    document.getElementById('output' + tab.charAt(0).toUpperCase() + tab.slice(1)).classList.remove('hidden');
}

async function compile() {
    const code = editor.getValue();
    const priv = getPrivate();
    const pub = getPublic();
    setStatus('Compiling...');
    document.getElementById('outputConsole').textContent = 'Compiling...\n';
    try {
        const data = await apiPost('/api/compile', { code, private: priv, public: pub });
        const out = data.ok ? data.stdout : (data.error || data.stdout);
        document.getElementById('outputConsole').textContent = out;
        setStatus(data.ok ? 'Compiled' : 'Error', data.ok);
        addReport('COMPILE', code, priv, pub, data.ok, out);
    } catch (err) {
        document.getElementById('outputConsole').textContent = '✗ ' + err.message;
        setStatus('Error', false);
        addReport('COMPILE', code, priv, pub, false, err.message);
    }
}

async function prove() {
    const code = editor.getValue();
    const priv = getPrivate();
    const pub = getPublic();
    setStatus('Proving...');
    document.getElementById('outputConsole').textContent = 'Generating proof...\n';
    try {
        const data = await apiPost('/api/prove', { code, private: priv, public: pub });
        const out = data.ok ? data.stdout : (data.error || data.stdout);
        document.getElementById('outputConsole').textContent = out;
        if (data.proof) {
            document.getElementById('outputProof').textContent = JSON.stringify(data.proof, null, 2);
        }
        setStatus(data.ok ? 'Proof ready' : 'Error', data.ok);
        addReport('PROVE', code, priv, pub, data.ok, out);
    } catch (err) {
        document.getElementById('outputConsole').textContent = '✗ ' + err.message;
        setStatus('Error', false);
        addReport('PROVE', code, priv, pub, false, err.message);
    }
}

async function verify() {
    const code = editor.getValue();
    const priv = getPrivate();
    const pub = getPublic();
    setStatus('Verifying...');
    document.getElementById('outputConsole').textContent = 'Verifying...\n';
    try {
        const data = await apiPost('/api/verify', { code, private: priv, public: pub });
        const out = data.ok ? data.stdout : (data.error || data.stdout);
        document.getElementById('outputConsole').textContent = out;
        setStatus(data.ok ? 'Verified' : 'Error', data.ok);
        addReport('VERIFY', code, priv, pub, data.ok, out);
    } catch (err) {
        document.getElementById('outputConsole').textContent = '✗ ' + err.message;
        setStatus('Error', false);
        addReport('VERIFY', code, priv, pub, false, err.message);
    }
}

async function reset() {
    setStatus('Reset');
    document.getElementById('outputConsole').textContent = '// Reset. Ready.';
    document.getElementById('outputProof').textContent = '';
}

function downloadReport() {
    const total = reportLog.length;
    const pass = reportLog.filter(r => r.status === 'PASS').length;
    const fail = total - pass;
    let md = `# Astra Playground Test Report\n`;
    md += `**Generated:** ${new Date().toISOString()}\n`;
    md += `**API:** ${API_BASE}\n`;
    md += `**Total tests:** ${total} | **PASS:** ${pass} | **FAIL:** ${fail}\n\n`;
    md += `---\n\n`;
    reportLog.forEach((r, i) => {
        md += `## ${i + 1}. ${r.action} — ${r.status}\n`;
        md += `- **Time:** ${r.timestamp}\n`;
        md += `- **Private inputs:** \`${(r.private || []).join(', ') || '(none)'}\`\n`;
        md += `- **Public inputs:** \`${(r.public || []).join(', ') || '(none)'}\`\n`;
        md += `- **Code:**\n\`\`\`\n${r.code}\n\`\`\`\n`;
        md += `- **Result:**\n\`\`\`\n${r.result}\n\`\`\`\n\n`;
    });
    const blob = new Blob([md], { type: 'text/markdown' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `astra-report-${Date.now()}.md`;
    a.click();
    URL.revokeObjectURL(url);
}
</script>
</body>
</html>
