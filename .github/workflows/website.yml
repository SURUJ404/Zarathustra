name: website

on:
  push:
    branches: [main]
    paths:
      - 'web/**'
      - 'vercel.json'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  deployments: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          target: x86_64-unknown-linux-gnu

      - name: Build astra CLI
        run: |
          cargo build --release --locked
          cp target/release/astra web/api/astra
          chmod +x web/api/astra

      - name: Install deps
        run: npm ci --omit=dev
        working-directory: web

      - name: Deploy to Vercel
        run: |
          mkdir -p web/.vercel
          printf '{"orgId":"%s","projectId":"%s"}\n' \
            "${{ secrets.ORGID }}" \
            "prj_VhbnkUsDgGsmsqOLMJ3EpN4T0Cqv" \
            > web/.vercel/project.json
          npx --yes vercel@latest deploy --prod \
            --token="${{ secrets.VERCEL_TOKEN }}" \
            --scope=${{ secrets.ORGID }} \
            --cwd=web \
            --yes --force
