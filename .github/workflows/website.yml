name: website

on:
  push:
    branches: [main]
    paths:
      - 'web/**'
      - 'api/**'
      - 'package*.json'
      - 'vercel.json'
      - 'Cargo.*'
      - 'astra_core/**'
      - 'astra_cli/**'
      - 'astra_security/**'
      - '.github/**'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  deployments: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          target: x86_64-unknown-linux-gnu

      - name: Build astra CLI
        run: |
          cargo build --release --locked
          mkdir -p api
          cp target/release/astra api/astra
          chmod +x api/astra

      - name: Self-audit
        run: ./target/release/astra audit --deny high .

      - name: Install deps
        run: npm ci --omit=dev

      - name: Deploy to Vercel
        run: |
          npx --yes vercel@latest deploy --prod \
            --token="${{ secrets.ZARATOKEN }}" \
            --scope=${{ secrets.ORGID }} \
            --yes --force
