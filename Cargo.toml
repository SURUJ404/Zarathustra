[workspace]
resolver = "2"
members = [
    "astra_ir",
    "astra_frontend",
    "astra_codegen",
    "astra_prover",
    "astra_stdlib",
    "astra_publish",
    "astra_cli",
    "astra_security",
]

[workspace.dependencies]
bls12_381 = "0.8"
ff = "0.13"
group = "0.13"
rand = "0.8"
num-bigint = "0.4"
clap = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
regex = "1"
syn = { version = "2", features = ["full", "visit"] }
quote = "1"
proc-macro2 = { version = "1", features = ["span-locations"] }

# arkworks proof systems
ark-ff = "0.5"
ark-relations = "0.5"
ark-bn254 = "0.5"
ark-groth16 = "0.5"
ark-snark = "0.5"
ark-std = "0.5"
